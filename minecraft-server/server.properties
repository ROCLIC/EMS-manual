# Minecraft NeoForge 1.21.1 - Configuración del Servidor
# Última actualización: 2026-07-26

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN BÁSICA
# ═══════════════════════════════════════════════════════════════
motd=Servidor NeoForge 1.21.1 - Con Ngrok!
level-name=world
level-seed=
gamemode=survival
difficulty=normal
max-players=10
server-port=25565
view-distance=8
simulation-distance=6

# ═══════════════════════════════════════════════════════════════
# OPCIONES DE JUEGO
# ═══════════════════════════════════════════════════════════════
enable-command-block=true
pvp=true
spawn-protection=16
generate-structures=true
hardcore=false
force-gamemode=false
allow-nether=true
spawn-npcs=true
spawn-animals=true
spawn-monsters=true

# ═══════════════════════════════════════════════════════════════
# RENDIMIENTO (importante para 190 mods)
# ═══════════════════════════════════════════════════════════════
entity-broadcast-range-percentage=100
network-compression-threshold=256
max-tick-time=60000
max-chained-neighbor-updates=1000000

# ═══════════════════════════════════════════════════════════════
# SEGURIDAD
# ═══════════════════════════════════════════════════════════════
online-mode=true
white-list=false
enforce-secure-profile=false

# ═══════════════════════════════════════════════════════════════
# RCON (para control remoto opcional)
# ═══════════════════════════════════════════════════════════════
enable-rcon=false
rcon.port=25575
rcon.password=

# ═══════════════════════════════════════════════════════════════
# OPCIONES ADVANZADAS
# ═══════════════════════════════════════════════════════════════
snooper-enabled=false
level-type=minecraft\:normal
allow-flight=false
sync-chunk-writes=true
enable-status=true
text-filtering-config=
prevent-proxy-connections=false
resource-pack=
resource-pack-prompt=
resource-pack-sha1=
require-resource-pack=false
